<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Josef Krubner, trenér, lektor a výživový poradce</title>
<meta name="description" content="Josef Krubner, trenér, lektor a výživový poradce. Kontakt: e-mail, telefon, Instagram a Facebook.">
<meta name="theme-color" content="#f6f3ec">
<meta property="og:title" content="Josef Krubner, trenér, lektor a výživový poradce">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--ink:#1e2a1b;--muted:#5b6557;--green:#244a16;--green-soft:#e4e8d9;--shape:3.5rem}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}

main{flex:1;width:100%;max-width:34rem;margin:0 auto;padding:3rem 1.5rem 2rem;text-align:center}

/* portrét, tvar ze šanonu: dva zaoblené rohy */
.portrait{
  width:15rem;aspect-ratio:1/1;margin:0 auto 2rem;background:var(--green-soft);
  border-radius:var(--shape) 0 var(--shape) 0;overflow:hidden;display:grid;place-items:center;
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait span{font-size:5rem;font-weight:800;color:var(--green);opacity:.25;letter-spacing:-.04em}

h1{font-size:clamp(2.5rem,9vw,3.5rem);line-height:1.05;letter-spacing:-.03em;font-weight:800;color:var(--green);margin:0 0 .75rem}
.role{font-size:1.125rem;font-weight:500;color:var(--muted);margin:0 0 2.5rem}

/* kontakt */
.contact{background:var(--green);color:var(--bg);border-radius:var(--shape) 0 var(--shape) 0;padding:2rem 1.5rem}
.contact a.line{display:block;font-size:clamp(1.15rem,4.5vw,1.5rem);font-weight:600;text-decoration:none;padding:.6rem 0;overflow-wrap:anywhere}
.contact a.line:hover{text-decoration:underline;text-underline-offset:.3em}
.social{display:flex;justify-content:center;gap:1rem;margin-top:1.25rem}
.social a{
  width:3rem;height:3rem;display:grid;place-items:center;border-radius:50%;
  border:2px solid rgba(246,243,236,.5);color:var(--bg);
}
.social a:hover{background:var(--bg);color:var(--green);border-color:var(--bg)}
.social svg{width:1.4rem;height:1.4rem}
.contact :focus-visible{outline-color:var(--bg)}

footer{padding:1.5rem;text-align:center;font-size:.8125rem;color:var(--muted)}
footer p{margin:0}
</style>
</head>
<body>

<main>
  <!-- Fotku nahraď: <img src="foto.jpg" alt="Josef Krubner"> místo <span> -->
  <figure class="portrait" style="margin-top:0" aria-label="Místo pro fotografii"><img src="foto.jpg" alt="Josef Krubner"></figure>

  <h1>Josef Krubner</h1>
  <p class="role">trenér, lektor a výživový poradce</p>

  <section class="contact" aria-label="Kontakt">
    <a class="line" href="mailto:kontakt@josefkrubner.cz">kontakt@josefkrubner.cz</a>
    <a class="line" href="tel:+420721975320">+420 721 975 320</a>
    <div class="social">
      <a href="https://www.instagram.com/josef_krubner" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://www.facebook.com/pepa.krubner" aria-label="Facebook" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.6-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.3 0-3.9 1.4-3.9 4v2.2H8V13.5h2.5V21h3z"/></svg>
      </a>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 Josef Krubner. IČO: 17901731.</p>
<p>Fyzická osoba zapsaná v živnostenském rejstříku od 4. 1. 2023</p>
<p>Evidující úřad: Městský úřad Dobříš</p>
</footer>

</body>
</html>
