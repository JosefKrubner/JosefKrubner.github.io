<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Josef Krubner, trenér, lektor a výživový poradce</title>
<meta name="description" content="Josef Krubner, trenér, lektor a výživový poradce. Kontakt: e-mail, telefon, Instagram a Facebook.">
<meta name="theme-color" content="#f6f3ec">
<meta property="og:title" content="Josef Krubner, trenér, lektor a výživový poradce">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--ink:#1e2a1b;--muted:#5b6557;--green:#244a16;--green-soft:#e4e8d9;--shape:3rem}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}

/* identita: fotka má vždy přesně šířku jména */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;text-align:center}
.identity{width:fit-content;max-width:100%}
.portrait{
  /* width:0 + min-width:100% = fotka šířku bloku neovlivňuje, přebírá ji od jména */
  width:0;min-width:100%;aspect-ratio:1/1;margin:0 0 1.75rem;
  background:var(--green-soft);border-radius:var(--shape) 0 var(--shape) 0;overflow:hidden;
  display:block;
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}

h1{
  margin:0;white-space:nowrap;font-weight:800;color:var(--green);
  font-size:clamp(2rem,9.5vw,3.5rem);line-height:1.05;letter-spacing:-.03em;
}
.role{font-size:1.0625rem;font-weight:500;color:var(--muted);margin:.75rem 0 0}

/* kontakt přes celou šířku, bez zaoblení, vše na střed pod sebou */
.contact{background:var(--green);color:var(--bg);padding:2.5rem 1.5rem;text-align:center}
.contact .inner{max-width:64rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.contact h2{align-self:flex-start;text-align:left;margin:0 0 .75rem;font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.contact a.line{display:inline-flex;align-items:center;justify-content:center;gap:.7rem;font-size:clamp(1.15rem,4.5vw,1.5rem);font-weight:600;text-decoration:none;padding:.4rem 0;overflow-wrap:anywhere}
.contact a.line svg{width:1.15em;height:1.15em;flex:none}
.contact a.line:hover{text-decoration:underline;text-underline-offset:.3em}
.social{display:flex;flex-direction:row;justify-content:center;gap:1rem;margin-top:.75rem}
.social a{
  width:3rem;height:3rem;display:grid;place-items:center;border-radius:50%;
  border:2px solid rgba(246,243,236,.5);color:var(--bg);
}
.social a:hover{background:var(--bg);color:var(--green);border-color:var(--bg)}
.social svg{width:1.4rem;height:1.4rem}
.contact :focus-visible{outline-color:var(--bg)}

footer{padding:1.5rem;text-align:center;font-size:.8125rem;color:var(--muted)}
footer p{margin:0}

/* tablet */
@media (min-width:768px){
  :root{--shape:4rem}
  main{padding:4.5rem 2rem 4rem}
  h1{font-size:clamp(3.5rem,8vw,5rem)}
  .role{font-size:1.375rem;margin-top:1rem}
  .portrait{margin-bottom:2.25rem}
  .contact{padding:3.5rem 2rem}
  .contact h2{font-size:2.25rem;margin-bottom:1rem}
  .contact a.line{font-size:1.5rem}
}

/* PC */
@media (min-width:1100px){
  :root{--shape:5rem}
  main{padding:6rem 2rem 5rem}
  h1{font-size:clamp(5rem,6vw,6.5rem)}
  .role{font-size:1.625rem}
  .contact{padding:4.5rem 2rem}
  .contact h2{font-size:2.75rem;margin-bottom:1.25rem}
  .contact a.line{font-size:1.875rem}
  .social a{width:3.5rem;height:3.5rem}
  .social svg{width:1.6rem;height:1.6rem}
  footer{padding:2rem;font-size:.875rem}
}
</style>
</head>
<body>

<main>
  <div class="identity">
    <figure class="portrait"><img src="foto.webp" alt="Josef Krubner"></figure>
    <h1>Josef Krubner</h1>
  </div>
  <p class="role">trenér, lektor a výživový poradce</p>
</main>

<section class="contact" aria-label="Kontakt">
  <div class="inner">
    <h2>Kontakt</h2>
    <a class="line" href="mailto:kontakt@josefkrubner.cz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>kontakt@josefkrubner.cz</span></a>
    <a class="line" href="tel:+420721975320"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>+420 721 975 320</span></a>
    <div class="social">
      <a href="https://www.instagram.com/josef_krubner" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://www.facebook.com/pepa.krubner" aria-label="Facebook" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.6-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.3 0-3.9 1.4-3.9 4v2.2H8V13.5h2.5V21h3z"/></svg>
      </a>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 Josef Krubner. IČO: 17901731.</p>
  <p>Fyzická osoba zapsaná v živnostenském rejstříku od 4. 1. 2023</p>
  <p>Evidující úřad: Městský úřad Dobříš</p>
</footer>

</body>
</html>
